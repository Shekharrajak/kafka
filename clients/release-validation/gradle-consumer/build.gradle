// Standalone Gradle project that consumes kafka-clients as an external dependency.
// Used by clients/release-validation/run-validation.sh to verify a candidate
// kafka-clients release artefact can be built and run by a downstream consumer.

plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri('https://repository.apache.org/content/repositories/staging/') }
}

ext {
    // Override with -PkafkaVersion=4.4.0 (or any released/staged version).
    kafkaVersion = project.findProperty('kafkaVersion') ?: '4.3.0'
}

dependencies {
    implementation "org.apache.kafka:kafka-clients:${kafkaVersion}"
    implementation 'org.slf4j:slf4j-simple:1.7.36'
}

application {
    mainClass = 'org.apache.kafka.validation.ClientValidation'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('run') {
    standardOutput = System.out
    errorOutput = System.err
}
