lowercaseOutputName: true
rules:
  - pattern: 'java.lang<type=OperatingSystem><>ProcessCpuLoad'
    name: demo_jvm_process_cpu_ratio
    type: GAUGE
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>used'
    name: demo_jvm_heap_used_bytes
    type: GAUGE
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>max'
    name: demo_jvm_heap_max_bytes
    type: GAUGE
  - pattern: 'kafka.server<type=SharePartitionMetrics, name=InFlightMessageCount, group=(.+), topic=(.+), partition=(.+)><>Value'
    name: kafka_share_inflight_records
    labels: {group: '$1', topic: '$2', partition: '$3'}
    type: GAUGE
  - pattern: 'kafka.server<type=SharePartitionMetrics, name=AcquisitionLockTimeoutPerSec, group=(.+), topic=(.+), partition=(.+)><>Count'
    name: kafka_share_lock_timeouts_total
    labels: {group: '$1', topic: '$2', partition: '$3'}
    type: COUNTER
  - pattern: 'kafka.server<type=ShareGroupMetrics, name=RecordAcknowledgementsPerSec, ackType=(.+)><>Count'
    name: kafka_share_acknowledgements_total
    labels: {ack_type: '$1'}
    type: COUNTER
