global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: demo-control
    static_configs:
      - targets: ['control:8090']
  - job_name: connect-tasks
    static_configs:
      - targets: ['classic-1:9101', 'classic-2:9101', 'classic-3:9101', 'share-1:9101', 'share-2:9101', 'share-3:9101']
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: worker
        replacement: '$1'
  - job_name: connect-jmx
    static_configs:
      - targets: ['classic-1:9404', 'classic-2:9404', 'classic-3:9404']
        labels: {mode: classic}
      - targets: ['share-1:9404', 'share-2:9404', 'share-3:9404']
        labels: {mode: share}
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: worker
        replacement: '$1'
  - job_name: broker-jmx
    static_configs:
      - targets: ['broker:9404']
