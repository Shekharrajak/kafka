process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=broker:9093
listeners=PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
advertised.listeners=PLAINTEXT://broker:9092,HOST://localhost:19092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
log.dirs=/var/lib/kafka/data
num.partitions=3
auto.create.topics.enable=false
offsets.topic.replication.factor=1
offsets.topic.num.partitions=3
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
share.coordinator.state.topic.num.partitions=3
group.initial.rebalance.delay.ms=0
group.share.min.record.lock.duration.ms=1000
log.retention.hours=24
log.segment.bytes=16777216
