base {
    archivesName = 'connect-share-demo'
}

configurations {
    jmxAgent
}

dependencies {
    implementation project(':clients')
    implementation project(':connect:api')
    implementation libs.jacksonDatabind
    compileOnly project(':group-coordinator:group-coordinator-api')
    jmxAgent('io.prometheus.jmx:jmx_prometheus_javaagent:1.0.1') { transitive = false }
    testImplementation libs.junitJupiter
    testImplementation libs.mockitoCore
    testImplementation project(':group-coordinator:group-coordinator-api')
    testRuntimeOnly libs.junitPlatformLauncher
}

checkstyle {
    configProperties = [importControlFile: '../examples/connect-share-demo/config/import-control.xml']
}

javadoc.enabled = false

jar {
    exclude '**/FullSharingAssignor*'
}

def assignorJar = tasks.register('assignorJar', Jar) {
    archiveClassifier = 'assignor'
    from sourceSets.main.output
    include '**/FullSharingAssignor*'
}

tasks.register('stageDemo', Sync) {
    into layout.buildDirectory.dir('image')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('bin')) { into 'kafka/bin' }
    from(rootProject.file('config')) { into 'kafka/config' }
    from(rootProject.file('licenses')) { into 'kafka/licenses' }
    from(rootProject.file('LICENSE-binary')) { into 'kafka'; rename { 'LICENSE' } }
    from(rootProject.file('NOTICE-binary')) { into 'kafka'; rename { 'NOTICE' } }
    [':core', ':connect:runtime', ':tools'].each { path ->
        from(project(path).tasks.named('jar')) { into 'kafka/libs' }
        from(project(path).configurations.runtimeClasspath) { into 'kafka/libs' }
    }
    from(project(':core').configurations.releaseOnly) { into 'kafka/libs' }
    from(tasks.named('jar')) { into 'plugin' }
    from(assignorJar) { into 'kafka/libs' }
    from(configurations.jmxAgent) { into 'agent'; rename { 'jmx-agent.jar' } }
    from('config') { into 'demo-config'; exclude 'import-control.xml' }
    from('scripts/entrypoint.sh')
    from('Dockerfile')
}
